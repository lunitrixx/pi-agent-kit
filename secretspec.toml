# Declares the secrets this project needs. Values never go here: each person stores them in their own
# provider (secretspec config global init). Start agents with `secretspec run -- claude` or `-- pi`.
[project]
name = "lunitrixx-pi-agent-kit"
revision = "1.0"

# Shared repository secrets live in OpenBao. A secret opts in with providers = ["team"].
# Secrets without providers use the personal default provider (the system keyring).
[providers]
team = "openbao://team@openbao.headfirst.cloud/repo-secrets"

[profiles.default]
# Fixed ref: one token per person in the keyring, shared by every project instead of stored per project name.
FORGEJO_TOKEN = { description = "Forgejo API token (git.headfirst.cloud) for the forgejo MCP server", required = true, ref = { item = "FORGEJO_TOKEN" } }

# Example of a shared secret in OpenBao. Optional, so nobody needs it to start the shell.
TEAM_TEST_SECRET = { description = "Example for a shared secret stored in OpenBao (team)", required = false, providers = ["team"] }

# Provider keys for pi when the kit is tried against a hosted model. The kit itself reads none of them.
OPENAI_API_KEY = { description = "Optional OpenAI API key for pi", required = false }
ANTHROPIC_API_KEY = { description = "Optional Anthropic API key for pi", required = false }
GROQ_API_KEY = { description = "Optional Groq API key for pi", required = false }
