# yaml-language-server: $schema=https://raw.githubusercontent.com/raine/workmux/main/schema.json
#
# One task, one worktree, one window.
#
# `workmux add feat/whatever -l pi` branches off main, lays out a single agent and
# starts it with the task already in it. Agents do not share a checkout, which
# matters here for a specific reason: this repository is a Pi *package*, and its
# extensions are loaded from paths listed in package.json. Two agents editing
# `extensions/` in one tree would each load half of the other's work and blame the
# harness for it.
#
# `workmux config reference` prints every option with its documentation.

# The default branch, read rather than guessed: `origin/HEAD` resolves to
# refs/remotes/origin/main, and `.pi/rules/workflow.md` forbids committing to it
# directly at all - every change goes through a branch and a pull request.
#
# Named rather than `auto`. `auto` is a resolution chain (main_branch, origin/HEAD,
# main, master) that lands on the same branch while costing a reader a lookup.
# Named also means a worktree created while sitting on a feature branch still
# branches from main instead of inheriting unfinished work - which is how this file
# would have been written into somebody else's task.
base_branch: main

# workmux brings its own tmux session per worktree.
#
# The default `window` places the agent in the session you are already in, and
# fails with "cannot determine the tmux session for window placement" when there is
# none - which is exactly the situation a dispatch script runs in. `session`
# removes that prerequisite; `workmux dashboard` is how you look at them.
mode: session

# A built-in, not one of the named profiles from ~/.config/workmux/config.yaml.
#
# `agents` is global-only, so `coder-pi` means nothing on a machine that has not
# defined it - and this file is committed. The model tier is chosen per task via
# the layouts below.
agent: claude

#-------------------------------------------------------------------------------
# Panes
#-------------------------------------------------------------------------------

# ONE PANE PER WINDOW, everywhere in this file.
#
# An agent needs about 68 columns; below that it dies on "Rendered line 2 exceeds
# terminal width", and at 80 columns any split leaves both halves under that.
# There is also nothing to put in a second pane here - this repository has no dev
# server, no watcher and no test runner that stays resident; the suite is six
# scripts that run in a few seconds and exit.
panes:
  - command: <agent>
    name: agent
    focus: true

#-------------------------------------------------------------------------------
# Named layouts
#-------------------------------------------------------------------------------

# The two model tiers. The names are the contract with the orchestrator's
# projects.yaml, which dispatches with `-l pi` or `-l claude`.
#
#   workmux add feat/x -l pi       DeepSeek V4 Pro through pi, for bounded work
#   workmux add feat/y -l claude   the expensive one
#
# Worth knowing when choosing here: the global config's own note on coder-pi is
# that its weakest language by LLM judge is JavaScript, with TypeScript at 36.1%.
# Every extension in this repository is TypeScript, so `-l pi` belongs on the
# bounded, checkable jobs - one skill, one prompt, one extension option - and
# anything touching the loader wiring or a shared file under `lib/` goes to claude.
#
# The profiles themselves (coder-pi, coder-claude) live in the global config,
# because which model you drive and with whose credentials is a property of the
# machine, not of this repository.
layouts:
  pi:
    panes:
      - command: <agent:coder-pi>
        name: agent
        focus: true

  claude:
    panes:
      - command: <agent:coder-claude>
        name: agent
        focus: true

#-------------------------------------------------------------------------------
# Files
#-------------------------------------------------------------------------------

files:
  # Personal, gitignored or untracked, and per checkout.
  #
  # None of the three exists in this checkout today. That is deliberate rather than
  # sloppy: every entry is run through the glob crate, so a pattern with no match is
  # silently skipped, and listing them now means they are picked up the day they
  # appear.
  #
  #   .envrc.local              the API keys. `.envrc.local-template` is committed
  #                             and documents exactly this file. See post_create for
  #                             why nothing loads it automatically yet.
  #   .pi/pi-agent-kit.json     this kit's own per-project config - lib/config.ts
  #                             reads and writes it, and the extensions toggle
  #                             themselves through it. Copied, not shared: an agent
  #                             that disables a widget in its worktree must not
  #                             disable it in the main checkout.
  #   .claude/settings.local.json   the same thing for the Claude Code adapter.
  copy:
    - .envrc.local
    - .pi/pi-agent-kit.json
    - .claude/settings.local.json

  # Nothing. This is a finding, not an omission.
  #
  # `node_modules` is the obvious candidate and is the one that must not be here.
  # The root package.json declares `workspaces: ["extensions/*"]`, so npm links
  # every extension into node_modules by name - a shared node_modules would make
  # `lntrx-permit` in one worktree resolve to the *main checkout's* source, and an
  # agent would then test code it is not editing. It is also written by
  # post_create's install, so two worktrees created at once would rewrite each
  # other's tree mid-install. Installing for real costs about three seconds against
  # a warm ~/.npm; sharing it costs correctness.
  #
  # There is no build output to share either: extensions ship as TypeScript and Pi
  # loads `src/extension.ts` directly, so there is no dist/ and no bundler cache.
  # `.pi-subagents/` is per-run scratch. The one piece of genuinely shared state,
  # the memory database, already lives outside the repository at ~/.pi/memory.db
  # and is therefore shared by every worktree without anything being linked.
  #
  # THE RULE, bought with 345 MB of deleted media in another project on 2026-08-09:
  # only gitignored leaf directories belong in this list. Symlinking a directory
  # that contains tracked files hides them from git, every worktree then reports
  # them as deleted, and an agent staging broadly removes them from the repository.
  # Check with `git ls-files <path>` before adding one - an empty result is the
  # permission.
  symlink: []

#-------------------------------------------------------------------------------
# Hooks
#-------------------------------------------------------------------------------

# Short - a few seconds - because there is nothing to build.
#
# NOT `direnv allow`, and that is checked rather than forgotten: this repository
# has no `.envrc` at all, only `.envrc.local-template`, so direnv has nothing to
# load and the keys are exported by hand or by the parent shell. If an `.envrc`
# ever appears, `direnv allow` belongs here on the same day - approval is per
# directory, and a worktree that has never been approved silently gets an empty
# environment rather than an error.
post_create:
  # From the lockfile, not `npm install`: a worktree must reproduce what the branch
  # actually pins, and `npm ci` fails loudly when package.json and the lockfile have
  # drifted apart instead of quietly fixing it. Measured at about three seconds.
  - npm ci

  # The test runner, and the reason it is installed rather than depended on.
  #
  # The test files are TypeScript that imports its own modules with `.js`
  # specifiers. Node 24 runs `.ts` natively but does not rewrite those specifiers,
  # so `node extensions/lntrx-permit/tests/shell.test.ts` dies with
  # ERR_MODULE_NOT_FOUND on `src/shell.js` - which reads like broken code and is
  # not. tsx resolves them, and the header of every test file already documents
  # `npx tsx <file>` as the way to run it.
  #
  # `--no-save` because tsx is not a dependency of this package and must not become
  # one by accident: AGENTS.md says dependencies are not changed without approval,
  # and this leaves package.json and package-lock.json untouched (verified - the
  # tree stays clean afterwards).
  - npm install --no-save tsx

# The checks, cheapest first. Any failure aborts the merge.
#
# THE ODDITY FIRST, because it explains the shape of this list: this repository has
# no CI pipeline. There is no `.github/` directory at all, and package.json has no
# `scripts` block - no test, no lint, no build. So there is nothing to mirror, and
# the authority is what AGENTS.md and README.md document plus what the test files
# say about themselves. The commands below are exactly that, and each one was run
# in a fresh clone before being written down.
#
# Deliberately NOT here: `npm audit`. It currently reports two high advisories in
# undici, reached through @earendil-works/pi-coding-agent - a peer dependency this
# repository does not control and cannot upgrade on its own. As a merge gate it
# would block every branch on somebody else's release schedule.
#
# Also not here: `pi install .`. It is the documented development step, but it
# writes into the user's global Pi configuration, and a merge check must not change
# state outside the worktree.
pre_merge:
  # The manifest check, and the one failure this repository ships silently.
  #
  # package.json is a list of paths - eleven extensions, the skills directory, the
  # themes directory - and nothing at load time tells you that one of them is a
  # typo except the extension quietly not being there. Renaming a directory without
  # editing package.json is a one-line mistake that no test catches. Half a second.
  - >-
    node -e "const fs=require('node:fs');const j=JSON.parse(fs.readFileSync('package.json','utf8'));const paths=[...j.pi.extensions,...j.pi.skills,...j.pi.themes];const missing=paths.filter(p=>!fs.existsSync(p));if(missing.length){console.error('pi manifest points at missing paths: '+missing.join(', '));process.exit(1)}console.log('pi manifest ok: '+paths.length+' paths')"

  # Re-run from the lockfile, because the branch may have changed it since
  # post_create. This is also why tsx is installed again on the next line: `npm ci`
  # deletes node_modules wholesale, and it takes the --no-save install with it.
  - npm ci
  - npm install --no-save tsx

  # The suite. Six files, roughly 150 assertions, a few seconds in total.
  #
  # A loop over globs rather than a list of filenames, so a test added under
  # `tests/` or under any extension is picked up without editing this file - which
  # matters more than usual here, because there is no `npm test` script to keep in
  # sync and this hook is the only place the suite is enumerated at all.
  #
  # `|| exit 1` is load-bearing: without it the loop swallows a failing file and
  # the hook exits with the status of the last test rather than the worst one.
  # `npx --yes` suppresses the install prompt in the case where post_create did not
  # run; with post_create having run, npx resolves the local tsx and fetches
  # nothing.
  - >-
    for f in tests/*.test.ts extensions/*/tests/*.test.ts; do echo "--- $f"; npx --yes tsx "$f" || exit 1; done

# pre_remove is deliberately ABSENT rather than empty, and the difference matters.
#
# `pre_remove: []` does not mean "nothing to do" - it *disables* workmux's default,
# which auto-detects Node projects and fast-deletes node_modules. That default is
# exactly what this repository wants: node_modules here is around a hundred
# thousand files, and removing it the ordinary way is the slowest part of tearing a
# worktree down. Omitting the key keeps it.
#
# There is nothing to add to it either. A Nix project leaves GC roots behind and a
# Laravel one leaves a test schema; everything this repository produces -
# node_modules, .pi-subagents/ - lives inside the worktree and goes with it. The
# memory database at ~/.pi/memory.db is shared and deliberately untouched: an agent
# finishing a task must not wipe what every other session recalls.
