# yaml-language-server: $schema=https://raw.githubusercontent.com/raine/workmux/main/schema.json
#
# One task, one worktree, one tmux session. `workmux add <branch>` creates the worktree beside the
# repository (`<repo>__worktrees/<branch>`), runs post_create and starts the agent.

# Named rather than `auto`, so a worktree created from a feature branch still branches from main.
base_branch: main

# The default `window` mode needs a running tmux session; a dispatch script has none.
mode: session

# Agent profiles live in ~/.config/workmux/config.yaml: model and credentials belong to the machine.
agent: coder-qwen

# One pane: an agent needs about 68 columns and a split leaves both halves below that.
panes:
  - command: <agent>
    name: agent
    focus: true

files:
  # Gitignored per-checkout state, copied (not linked). A pattern with no match is skipped.
  copy:
    - .env
    - .claude/settings.local.json
    - .pi/settings.local.json
  # Only gitignored leaf directories may be linked (`git ls-files <path>` empty).
  # Never node_modules: the npm workspaces link each extension into it by name, so a shared one would
  # resolve to another checkout's source, and parallel installs would rewrite each other's tree.
  symlink: []

# Enters the dev shell once before the agent starts: it generates `.mcp.json`, `.pi/settings.json`,
# `.claude/`, the skill links and the git hooks. Non-interactive, because an interactive shell would hang.
post_create:
  - nix develop -c true
  # From the lock file: `npm ci` fails when package.json and package-lock.json have drifted apart.
  - nix develop -c npm ci

# There is no CI, so these are the merge gates. `nix flake check -L` runs the git hooks, the formatter
# and the checks `pi-manifest` and `skills`. Not here: `npm audit` (its advisories are in the pi peer
# dependencies) and `pi install .` (it writes the user's global pi configuration).
pre_merge:
  - nix flake check -L
  # Again from the lock file, because the branch may have changed it since post_create.
  - nix develop -c npm ci

# Stray `result` links are GC roots that would outlive the worktree. Any pre_remove entry replaces
# workmux's default fast removal of node_modules, so `<cleanup-node-modules>` keeps it.
pre_remove:
  - rm -f result result-*
  - <cleanup-node-modules>
