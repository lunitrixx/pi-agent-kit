name: Bug report
about: Something does not work as expected
title: '[Bug]: '
labels:
  - Kind/Bug
body:
  - type: textarea
    id: description
    attributes:
      label: Bug description
      description: What happened, and what did you expect to happen? Screenshots are welcome.
      placeholder: I did this, and saw this error...
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: How to reproduce
      description: List the steps so we can recreate the bug.
      placeholder: Go here, run this, look at that.
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Logs
      description: Paste relevant logs or error output. They are rendered as code.
      render: shell
  - type: textarea
    id: environment
    attributes:
      label: Environment
      description: Nix version, operating system, branch or commit.
    validations:
      required: true
  - type: textarea
    id: additional
    attributes:
      label: Additional details
      description: Anything else we should know?
